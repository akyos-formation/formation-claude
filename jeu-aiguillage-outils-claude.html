<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Aiguilleur Claude</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : une tâche en haut comme un ticket à router, les six outils en grille de tuiles dessous, la correction juste après */
:root{
  --bg:#f7f8fb; --surface:#ffffff; --ink:#151a33; --muted:#5b6180; --line:#e2e5ef;
  --brand:#1474d4; --lime:#dcff1f; --lime-ink:#151a33;
  --tool:#e07a56; --tool-ink:#ffffff;
  --ok:#14804a; --ok-bg:#e6f5ec; --ko:#b4232c; --ko-bg:#fbeaeb;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1224; --surface:#181c33; --ink:#eef0f8; --muted:#a2a8c6; --line:#2b3052;
  --brand:#5aa8ff; --lime:#d4f51c; --lime-ink:#151a33; --tool:#e8876a; --tool-ink:#1a0f0a;
  --ok:#5fd69a; --ok-bg:#12321f; --ko:#ff8a91; --ko-bg:#3a161b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1224; --surface:#181c33; --ink:#eef0f8; --muted:#a2a8c6; --line:#2b3052;
  --brand:#5aa8ff; --lime:#d4f51c; --lime-ink:#151a33; --tool:#e8876a; --tool-ink:#1a0f0a;
  --ok:#5fd69a; --ok-bg:#12321f; --ko:#ff8a91; --ko-bg:#3a161b; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px;overflow-x:hidden}
.wrap{max-width:820px;margin:0 auto;display:grid;gap:22px;position:relative}
.deco{position:absolute;top:-40px;right:-50px;width:200px;height:150px;pointer-events:none;z-index:0}
header{position:relative;z-index:1;display:grid;gap:6px;max-width:680px}
.eyebrow{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.lede{color:var(--muted);margin:0;max-width:62ch}
.hud{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);position:relative;z-index:1}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.ko{background:var(--ko)} .dot.now{background:var(--ink)}
.score{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:18px;min-width:0}

.ticket{display:grid;gap:6px;padding:18px 20px;border-radius:12px;background:var(--bg);border:1.5px dashed var(--line)}
.ticket .n{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ticket p{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(19px,3.6vw,24px);line-height:1.25;text-wrap:balance}

.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tool{font:inherit;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;box-shadow:0 2px 8px color-mix(in srgb,var(--ink) 7%,transparent);transition:border-color .15s,transform .15s}
.tool:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.tool:focus-visible,.btn:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.tool:disabled{cursor:default}
.ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tool);display:grid;place-items:center}
.ic svg{width:24px;height:24px;stroke:var(--tool-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool .nm{font-weight:700;font-size:18px}
.tool.right{border-color:var(--ok);background:var(--ok-bg)}
.tool.wrong{border-color:var(--ko);background:var(--ko-bg)}
.tool.dim{opacity:.45}

.fb{border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--ok-bg)} .fb.ko{background:var(--ko-bg)}
.fb strong{color:var(--ok)} .fb.ko strong{color:var(--ko)}
.fb p{margin:0}
.fb .tip{font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.rank{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.ref{display:grid;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.ref .hd{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.ref .hd .ic{width:32px;height:32px;border-radius:8px}
.ref .hd .ic svg{width:18px;height:18px}
.ref .sc{margin-left:auto;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.ref p{margin:0;font-size:14px}
.ref .ex{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <svg class="deco" viewBox="0 0 200 150" aria-hidden="true">
    <path d="M30 20 q-10 70 50 70 q40 0 50-40" fill="none" stroke="var(--lime)" stroke-width="24" stroke-linecap="round"/>
    <path d="M160 10 l-18 120" fill="none" stroke="var(--lime)" stroke-width="24" stroke-linecap="round"/>
  </svg>
  <header>
    <span class="eyebrow">Atelier · Claude se présente sous plusieurs formes</span>
    <h1>L'Aiguilleur Claude</h1>
    <p class="lede">12 tâches tirées du quotidien. Pour chacune, envoyez-la vers l'outil Claude le plus adapté : Chat, Cowork, Docs, Slides, Design ou Code.</p>
  </header>
  <div class="hud"><div class="dots" id="dots"></div><span>Score : <span class="score" id="score">0</span> / <span id="total"></span></span></div>
  <main id="stage" aria-live="polite"></main>
</div>

<script>
const ICONS={
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 cowork:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M9 7v13M15 7v13"/>',
 docs:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
 slides:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/>',
 design:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5 1-1.5 2.5-1.5H18a3 3 0 0 0 3-3c0-5-4-9-9-9z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
 code:'<path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/>'};
const TOOLS=[
 {id:"chat",nm:"Chat",when:"Une question, une idée, un texte court à reformuler. On discute, on obtient une réponse.",ex:"Brainstormer, reformuler, expliquer."},
 {id:"cowork",nm:"Cowork",when:"Claude travaille sur vos fichiers et vos outils, y compris en tâche planifiée.",ex:"Classer un dossier, synthèse automatique chaque lundi."},
 {id:"docs",nm:"Docs",when:"Un document structuré qu'on rédige, relit et partage, puis qu'on exporte.",ex:"Programme, compte rendu, cahier des charges."},
 {id:"slides",nm:"Slides",when:"Une présentation à projeter ou à envoyer, diapositive par diapositive.",ex:"Support de réunion, synthèse visuelle d'un rapport."},
 {id:"design",nm:"Design",when:"Un visuel ou une maquette à voir avant de produire.",ex:"Maquette de site, affiche, visuel de post."},
 {id:"code",nm:"Code",when:"Construire quelque chose qui fonctionne : site, application, script.",ex:"Développer le site validé, outil de traitement de fichiers."}];
const T=Object.fromEntries(TOOLS.map(t=>[t.id,t]));
const ic=id=>`<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg></span>`;

// a = outil attendu
const Q=[
 {t:"Trouver trois idées de titre pour un webinaire sur l'IA au travail.",a:"chat",
  why:"Une demande ponctuelle et rapide : on discute, on choisit, c'est fini. Pas besoin de fichier ni de document.",
  tip:"Réflexe : une question, une réponse, sans livrable à conserver → Chat."},
 {t:"Préparer le support projeté au comité de direction jeudi.",a:"slides",
  why:"Le livrable est une présentation : des diapositives à projeter et à faire défiler.",
  tip:"Docs produirait un texte continu, pas un support à projeter."},
 {t:"Renommer et classer par mois les 200 factures PDF d'un dossier.",a:"cowork",
  why:"Claude doit agir directement sur vos fichiers, en nombre. Cowork travaille dans vos dossiers.",
  tip:"Dans le Chat, il faudrait déposer et renommer les 200 fichiers à la main."},
 {t:"Imaginer la maquette de la page d'accueil d'un nouveau site, avant de le développer.",a:"design",
  why:"On veut voir et valider l'apparence avant de construire. C'est la règle : Design d'abord, Code ensuite.",
  tip:"Passer directement par Code, c'est développer avant d'avoir validé le rendu."},
 {t:"Rédiger le programme détaillé d'une formation, que deux collègues vont relire et commenter.",a:"docs",
  why:"Un document structuré, destiné à être relu, commenté et partagé.",
  tip:"Le Chat donne le texte, mais pas un document qu'on fait vivre à plusieurs."},
 {t:"Transformer la maquette validée en vrai site web, prêt à mettre en ligne.",a:"code",
  why:"On passe de l'image au fonctionnement réel : pages, liens, formulaire. C'est le travail de Code.",
  tip:"Design s'arrête à la maquette ; Code la rend utilisable."},
 {t:"Reformuler un mail un peu sec avant de l'envoyer à un client.",a:"chat",
  why:"Une tâche courte et immédiate sur quelques lignes de texte.",
  tip:"Docs serait trop lourd pour un mail de dix lignes."},
 {t:"Transformer un rapport de 20 pages en 8 diapositives pour une réunion.",a:"slides",
  why:"La sortie attendue est une présentation. Slides découpe et met en forme diapositive par diapositive.",
  tip:"Le résumé en texte, c'est l'étape intermédiaire, pas le livrable."},
 {t:"Recevoir chaque lundi à 9 h une synthèse des mails clients de la semaine.",a:"cowork",
  why:"Deux indices : « chaque lundi » (tâche planifiée) et « mails » (connecteur vers votre messagerie). C'est le terrain de Cowork.",
  tip:"Le Chat ne se déclenche pas tout seul : il attend que vous lui écriviez."},
 {t:"Créer le visuel d'un post LinkedIn qui annonce un événement.",a:"design",
  why:"Le livrable est une image à publier : composition, texte, couleurs.",
  tip:"Pour aller plus loin : la méthode de la Leçon 6.8 sur la direction artistique."},
 {t:"Écrire le compte rendu d'une réunion, à exporter en Word pour le client.",a:"docs",
  why:"Un document mis en forme, à transmettre et à exporter.",
  tip:"Docs s'exporte en .docx ou en PDF ; un texte de Chat doit être recopié et remis en page."},
 {t:"Créer un petit outil qui fusionne les exports CSV de plusieurs boutiques et calcule les totaux.",a:"code",
  why:"On construit un outil réutilisable, qui fait le même traitement à chaque fois. C'est du développement.",
  tip:"Cowork peut faire la fusion une fois ; si vous voulez un outil qui la refait à chaque fois, c'est Code."},
];

let i=0, score=0, res=[], picked=null;
const $=s=>document.querySelector(s);
const stage=$("#stage");
$("#total").textContent=Q.length;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function dots(){
  $("#dots").innerHTML=Q.map((_,k)=>`<span class="dot ${res[k]===true?"ok":res[k]===false?"ko":k===i?"now":""}"></span>`).join("");
  $("#score").textContent=score;
}

function show(){
  dots();
  if(i>=Q.length) return end();
  const x=Q[i];
  stage.innerHTML=`<section class="card">
    <div class="ticket"><span class="n">Tâche ${i+1} sur ${Q.length}</span><p>${esc(x.t)}</p></div>
    <div class="tools">${TOOLS.map(t=>`<button class="tool" id="tool-${t.id}" data-id="${t.id}">${ic(t.id)}<span class="nm">${t.nm}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </section>`;
  stage.querySelectorAll(".tool").forEach(b=>b.onclick=()=>pick(b.dataset.id));
  if(picked) pick(picked,true);
}

function pick(id,restore){
  const x=Q[i], ok=id===x.a;
  if(!restore){picked=id; res[i]=ok; if(ok) score++; dots();}
  stage.querySelectorAll(".tool").forEach(b=>{b.disabled=true;
    const d=b.dataset.id; b.classList.add(d===x.a?"right":d===id?"wrong":"dim");});
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"ko"}"><strong>${ok?"Bon aiguillage : "+T[x.a].nm+".":"Ici, c'est plutôt "+T[x.a].nm+"."}</strong><p>${esc(x.why)}</p><p class="tip">${esc(x.tip)}</p></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="next">${i===Q.length-1?"Voir mon résultat":"Tâche suivante"}</button></div>`;
  $("#next").onclick=()=>{i++; picked=null; show();};
  if(!restore) $("#next").focus();
}

function end(){
  const per=Object.fromEntries(TOOLS.map(t=>[t.id,[0,0]]));
  Q.forEach((x,k)=>{per[x.a][1]++; if(res[k]) per[x.a][0]++;});
  const r=score>=11?["Aiguilleur en chef","Vous savez quel outil ouvrir avant même de commencer."]
        :score>=8?["Bon réflexe","Revoyez les outils où il vous manque des points ci-dessous."]
        :score>=5?["En rodage","Relisez la fiche de chaque outil, puis rejouez."]
        :["Premier passage","Normal au début : chaque outil a sa fiche ci-dessous."];
  stage.innerHTML=`<section class="card">
    <div class="big">${score}<span style="font-size:28px;color:var(--muted)"> / ${Q.length}</span></div>
    <p class="rank">${r[0]}</p><p style="margin:0;color:var(--muted)">${r[1]}</p>
    <h2>Quand utiliser quel outil</h2>
    <div class="sheet">${TOOLS.map(t=>`<div class="ref"><div class="hd">${ic(t.id)}${t.nm}<span class="sc">${per[t.id][0]} / ${per[t.id][1]}</span></div><p>${esc(t.when)}</p><p class="ex">${esc(t.ex)}</p></div>`).join("")}</div>
    <p class="note">Une tâche peut passer par plusieurs outils : maquette dans Design, puis site dans Code. Le jeu retient l'outil de l'étape décrite. Fonctions décrites en novembre 2026 : elles évoluent, vérifiez dans votre compte.</p>
    <div class="row"><button class="btn" id="again">Rejouer</button></div>
  </section>`;
  $("#again").onclick=()=>{i=0;score=0;res=[];picked=null;show();window.scrollTo(0,0)};
}

function start(d){ if(d&&typeof d.i==="number")({i,score,res,picked}=d); show(); }
window.claude?.hot?.snapshot?.(()=>({i,score,res,picked}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
